name: PR Preview Deploy

# SECURITY: This workflow runs in a trusted context with write permissions.
# The build step (pr-preview-build.yml) runs untrusted PR code without secrets.
# This workflow only processes build artifacts and never executes PR-controlled code.

on:
  workflow_run:
    workflows: ['PR Preview Build']
    types: [requested, completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-deploy
  cancel-in-progress: false

env:
  MAIN_URL: https://eclipse-glsp.github.io/glsp-core

jobs:
  deploy:
    name: Deploy Preview
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-22.04
    env:
      STARTED: ${{ github.event.action == 'requested' }}
      SUCCEEDED: ${{ github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success' }}
      # A cancelled build is almost always a superseded one, whose replacement rewrites the comment
      # right away, so it is not reported as a failure.
      FAILED: ${{ github.event.action == 'completed' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            core.setOutput('short-sha', run.head_sha.slice(0, 7));

            // Only set for same-repo pull requests; for forks the array comes back empty and the
            // pull request has to be looked up by its head branch.
            const fromPayload = run.pull_requests?.[0]?.number;
            if (fromPayload) {
              core.setOutput('number', fromPayload);
              return;
            }
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`
            });
            if (pulls.length === 0) {
              throw new Error(`No open pull request for ${run.head_repository.full_name}@${run.head_branch}`);
            }
            core.setOutput('number', pulls[0].number);

      # Posted as soon as the build starts so that the pull request shows the deployment is
      # underway. The same sticky comment is rewritten by the steps below.
      - name: Announce pending deployment
        if: env.STARTED == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            **Previews** for commit ${{ steps.pr.outputs.short-sha }}

            :hourglass_flowing_sand: Building. The preview links appear here once the deployment finishes.

            Current `main` for comparison: [workflow diagram](${{ env.MAIN_URL }}/diagram.html) | [MCP demo](${{ env.MAIN_URL }}/mcp-demo/)

      - name: Report failed build
        if: env.FAILED == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            **Previews** for commit ${{ steps.pr.outputs.short-sha }}

            :x: The preview build did not succeed (`${{ github.event.workflow_run.conclusion }}`). See the [build log](${{ github.event.workflow_run.html_url }}).

            Current `main` for comparison: [workflow diagram](${{ env.MAIN_URL }}/diagram.html) | [MCP demo](${{ env.MAIN_URL }}/mcp-demo/)

      - name: Checkout
        if: env.SUCCEEDED == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download preview site
        if: env.SUCCEEDED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-site
          path: ./preview-site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Deploy preview
        if: env.SUCCEEDED == 'true'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        id: preview
        with:
          source-dir: ./preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          pr-number: ${{ steps.pr.outputs.number }}
          action: deploy
          comment: false
      - name: Comment on PR
        if: env.SUCCEEDED == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            **Previews** for commit ${{ steps.pr.outputs.short-sha }}

            | Demo | This pull request | Current `main` |
            | --- | --- | --- |
            | Workflow diagram | [open](${{ steps.preview.outputs.deployment-url }}/diagram.html) | [open](${{ env.MAIN_URL }}/diagram.html) |
            | MCP demo | [open](${{ steps.preview.outputs.deployment-url }}/mcp-demo/) | [open](${{ env.MAIN_URL }}/mcp-demo/) |
