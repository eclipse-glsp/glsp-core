name: Main Deploy

# The demos are published to the separate `eclipse-glsp/glsp-previews` repository, so no
# deployment flow of this repository needs write access to `glsp-core` itself.

on:
  push:
    branches: [main]
    # Same filter as the CI workflow. A change that cannot affect the built demos is not deployed.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.vscode/**'
      - '.claude/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-deploy
  cancel-in-progress: true

env:
  DEPLOY_REPOSITORY: eclipse-glsp/glsp-previews
  DEPLOY_BRANCH: previews
  DEPLOY_DIR: glsp-core/main

jobs:
  build-and-deploy:
    name: Build & Deploy
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    environment:
      name: main
      url: https://eclipse-glsp.github.io/glsp-previews/glsp-core/main/diagram.html
    steps:
      # `persist-credentials: false` keeps the `GITHUB_TOKEN` auth header out of the git config.
      # The deploy step authenticates through the remote URL instead, and the header would take
      # precedence over it when pushing to the preview repository.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Build
        run: pnpm build
      - name: Assemble site
        run: pnpm bundle:site
      # Stale files are deleted inside `target-folder` only, so the pull request previews and the
      # directories of the other GLSP repositories are left alone. `force: false` matters because
      # the branch is shared: it rebases onto a concurrent deployment instead of overwriting it.
      - name: Deploy to preview repository
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          repository-name: ${{ env.DEPLOY_REPOSITORY }}
          branch: ${{ env.DEPLOY_BRANCH }}
          folder: dist-site
          target-folder: ${{ env.DEPLOY_DIR }}
          commit-message: Deploy glsp-core main (${{ github.sha }})
          force: false
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
