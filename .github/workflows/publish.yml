name: 'Publish to NPM'
# The publish baseline below recognizes `next` runs (scheduled and manual) by this name.
run-name: Publish ${{ inputs.dist-tag || 'next' }}

# `next` versions are published nightly and on demand, `latest` versions on demand (release flow).
on:
  schedule:
    # Daily at 22:00 UTC. GitHub disables schedules after 60 days without repository activity;
    # re-enable the workflow in the Actions tab if `next` versions stop appearing.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or commit SHA) to checkout and publish (latest only; next always publishes the head of main)'
        required: false
        type: string
      dist-tag:
        description: 'NPM dist-tag to use for publishing'
        required: false
        type: choice
        options:
          - next
          - latest
        default: 'next'
      full:
        description: 'Publish all packages, ignoring the affected-only baseline (next only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# serialize publish runs
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    if: github.repository == 'eclipse-glsp/glsp-core'
    permissions:
      contents: read
      # read the run history for the publish baseline
      actions: read
      # OIDC token for npm trusted publishing
      id-token: write
    env:
      DIST_TAG: ${{ inputs.dist-tag || 'next' }}
    steps:
      - name: Determine publish baseline
        id: baseline
        if: env.DIST_TAG == 'next'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          # The baseline is the head of main at the last `next` publish, so `next` versions must also be
          # published from the head of main.
          if [[ ( -n "$REF" && "$REF" != "main" && "$REF" != "refs/heads/main" ) || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::'next' versions are published from the head of main. Run on main with an empty ref (or 'main')."
            exit 1
          fi
          # Failed runs are ignored, so their changes are picked up again by the next run.
          SINCE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml --branch main --status success --limit 100 \
            --json headSha,displayTitle --jq '[.[] | select(.displayTitle == "Publish next")][0].headSha // ""')
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # `next` always publishes the head of main (see the baseline step), even for `ref: main`
          ref: ${{ (inputs.dist-tag || 'next') == 'next' && github.sha || inputs.ref || github.sha }}
          # Fetch all history to determine the canary version (commits since last release tag) and
          # the changes since the publish baseline
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish to NPM
        run: |
          if [[ "$DIST_TAG" == "next" ]]; then
            # Between a release and the bump of main back to a next version there is nothing to publish.
            # The bump changes all packages, so the next run publishes everything anyway.
            if [[ "$GITHUB_EVENT_NAME" == "schedule" && ! "$(node -p "require('./package.json').version")" =~ -next$ ]]; then
              echo "::notice::main is not on a next version (release in progress). Skipping the nightly publish."
              exit 0
            fi
            if [[ "$FULL" == "true" ]]; then
              pnpm publish:next --full
            elif [[ -z "$SINCE" ]]; then
              echo "::warning::No previous 'next' publish found. Publishing all packages."
              pnpm publish:next --full
            else
              # affected-only publish: the packages changed since the last `next` publish (none if main
              # did not change)
              pnpm publish:next --since "$SINCE"
            fi
          elif [[ "$DIST_TAG" == "latest" ]]; then
            pnpm publish:latest
          else
            echo "Unknown dist-tag: $DIST_TAG"
            exit 1
          fi
        env:
          FULL: ${{ inputs.full || false }}
          SINCE: ${{ steps.baseline.outputs.since }}
          NPM_CONFIG_PROVENANCE: 'true'
