name: 'Publish to NPM'

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or commit SHA) to checkout and publish'
        required: true
        type: string
      dist-tag:
        description: 'NPM dist-tag to use for publishing'
        required: false
        type: string
        default: 'next'
      full:
        description: 'Publish all packages, ignoring the affected-only baseline (next only)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or commit SHA) to checkout and publish'
        required: true
        type: string
      dist-tag:
        description: 'NPM dist-tag to use for publishing'
        required: false
        type: choice
        options:
          - next
          - latest
        default: 'next'
      full:
        description: 'Publish all packages, ignoring the affected-only baseline (next only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# serialize publish runs
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # OIDC token for npm trusted publishing
      id-token: write
    # inputs.ref is only set for explicit invocations (workflow_dispatch or workflow_call); a called
    # workflow runs under the caller's event name, so it cannot be detected via github.event_name
    if: github.repository == 'eclipse-glsp/glsp-core' && (inputs.ref || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_commit.id || github.sha }}
          # Fetch all history to determine the canary version (commits since last release tag)
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish to NPM
        run: |
          DIST_TAG="${{ inputs.dist-tag || 'next' }}"
          if [[ "$DIST_TAG" == "next" ]]; then
            FULL_FLAG=""
            if [[ "${{ inputs.full }}" == "true" ]]; then
              FULL_FLAG="--full"
            fi
            # affected-only publish: the CLI publishes the package groups changed by the last commit
            pnpm publish:next $FULL_FLAG
          elif [[ "$DIST_TAG" == "latest" ]]; then
            pnpm publish:latest
          else
            echo "Unknown dist-tag: $DIST_TAG"
            exit 1
          fi
        env:
          NPM_CONFIG_PROVENANCE: 'true'
